<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ai-ssh">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
  </defs>
  <!-- The plate: one dark rounded tile, the app's ink. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#plate)"/>
  <!-- The shield: access inside a boundary the agent controls. -->
  <path d="M32 7.5 51 14.8v15c0 12.6-8.1 20.8-19 25.9C21.1 50.6 13 42.4 13 29.8v-15Z"
        fill="#fafafa"/>
  <!-- The AI star: the agent that reasons about the task. -->
  <path d="M41 16.5 43.1 20.9 47.5 23 43.1 25.1 41 29.5 38.9 25.1 34.5 23 38.9 20.9Z"
        fill="#0d0d0d"/>
  <!-- The prompt: the shell the AI and the human reach, only through the vault. -->
  <path d="M21.8 31 28.2 37.4 21.8 43.8" fill="none" stroke="#0d0d0d"
        stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31.6 43.8H38" fill="none" stroke="#0d0d0d"
        stroke-width="4.8" stroke-linecap="round"/>
</svg>